<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Robot head - White with blue border -->
  <rect x="30" y="40" width="140" height="120" fill="white" stroke="#3b82f6" stroke-width="3" rx="5"/>
  
  <!-- Eyes - circular with primary blue -->
  <circle cx="70" cy="90" r="15" fill="#3b82f6"/>
  <circle cx="130" cy="90" r="15" fill="#3b82f6"/>
  
  <!-- Eye highlights for life -->
  <circle cx="75" cy="85" r="5" fill="white"/>
  <circle cx="135" cy="85" r="5" fill="white"/>
  
  <!-- Mouth - friendly smile -->
  <path d="M 60 130 Q 100 140 140 130" stroke="#3b82f6" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
